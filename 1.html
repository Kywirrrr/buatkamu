<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Surat Untuk Kamu 💘</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #ffe0ec, #ffd3f1);
      color: #ff4081;
      text-align: center;
    }

    .opening {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: fadeIn 2s ease;
    }

    .opening h1 {
      font-size: 3em;
      animation: bounce 1.5s infinite;
      text-shadow: 2px 2px #ffcce6;
    }

    .open-btn {
      margin-top: 30px;
      padding: 15px 30px;
      font-size: 1.2em;
      background: linear-gradient(45deg, #ff69b4, #ffb6c1);
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      animation: wiggle 2.5s infinite;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
    }

    .open-btn:hover {
      transform: scale(1.1);
    }

    .letter {
      display: none;
      padding: 40px;
      animation: fadeIn 1s ease;
    }

    .photos {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 20px;
    }

    .photos img {
      width: 150px;
      height: 200px;
      border-radius: 15px;
      border: 4px solid #ff69b4;
      object-fit: cover;
      transition: 0.3s;
    }

    .photos img:hover {
      transform: scale(1.05) rotate(1deg);
    }

    .cute-btn {
      margin-top: 30px;
      background: linear-gradient(45deg, #ff69b4, #ffb6c1);
      padding: 15px 25px;
      border: none;
      border-radius: 30px;
      font-size: 1em;
      color: white;
      cursor: pointer;
      animation: wiggle 3s infinite;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .cute-btn:hover {
      transform: scale(1.1);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(2deg); }
      50% { transform: rotate(-2deg); }
      75% { transform: rotate(2deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Tampilan Awal -->
  <div class="opening" id="opening">
    <h1>Ada Surat Untuk Kamu 💌</h1>
    <button class="open-btn" onclick="bukaSurat()">Buka Surat 💘</button>
  </div>

  <!-- Isi Surat -->
  <div class="letter" id="letter">
    <h1>Untuk Kamu yang Aku Sayang 💖</h1>
    <p>
      Hai sayangku 💕<br><br>
      Aku cuma mau bilang satu hal sederhana…<br>
      Aku bersyukur banget bisa kenal kamu.<br>
      Kamu itu lucu, baik, dan selalu bikin hariku lebih cerah ✨<br>
      Makasih udah selalu ada dan bikin aku senyum tiap hari 😘<br><br>
      Pokoknya aku sayang kamu banget! 💞
    </p>

    <div class="photos">
      <img src="IMG-20250317-WA0066.jpg" alt="Foto 1">
      <img src="IMG-20250317-WA0070.jpg" alt="Foto 2">
      <img src="IMG-20250329-WA0040.jpg" alt="Foto 3">
      <img src="IMG-20250402-WA0097.jpg" alt="Foto 4">
    </div>

    <button class="cute-btn" onclick="alert('Aku juga sayang kamu 😍')">Klik kalau kamu juga sayang aku 💘</button>
  </div>

  <script>
    function bukaSurat() {
      document.getElementById('opening').style.display = 'none';
      document.getElementById('letter').style.display = 'block';
    }
  </script>
</body>
</html>
